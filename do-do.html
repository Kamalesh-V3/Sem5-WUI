<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Application</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    width: 450px;
    max-width: 95%;
    padding: 24px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
}

h1 {
    margin-top: 0;
    text-align: center;
    color: #222;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input:focus {
    outline: 2px solid #999;
    outline-offset: 1px;
}

button {
    padding: 9px 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background: #f5f5f5;
    color: #222;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #e9e9e9;
}

.add-btn {
    background: #333;
    border-color: #333;
    color: #fff;
}

.add-btn:hover {
    background: #111;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
    background: #f7f7f7;
    border: 1px solid #e5e5e5;
    border-radius: 5px;
}

.task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    color: #222;
}

.completed .task-text {
    text-decoration: line-through;
    color: #777;
}

.task-checkbox {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
}

.delete-btn {
    flex-shrink: 0;
    background: #fff;
}

#message {
    margin-top: 14px;
    text-align: center;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h1>My To-Do List</h1>

    <div class="input-area">
        <input type="text" id="taskInput"
               placeholder="Enter a new task">
        <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <p id="message">No tasks added yet.</p>
</div>

<script>
const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");
const message = document.getElementById("message");

function updateMessage() {
    message.textContent = taskList.children.length === 0
        ? "No tasks added yet."
        : taskList.querySelectorAll(".completed").length +
          " of " + taskList.children.length + " tasks completed.";
}

function addTask() {
    const task = taskInput.value.trim();

    if (task === "") {
        taskInput.focus();
        return;
    }

    const li = document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "task-checkbox";
    checkbox.onchange = function() {
        updateTask(this);
    };

    const span = document.createElement("span");
    span.className = "task-text";
    span.textContent = task;

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "delete-btn";
    deleteButton.onclick = function() {
        deleteTask(this);
    };

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(deleteButton);

    taskList.appendChild(li);

    taskInput.value = "";
    taskInput.focus();

    updateMessage();
}

function updateTask(checkbox) {
    const li = checkbox.parentElement;

    if (checkbox.checked) {
        li.classList.add("completed");
    } else {
        li.classList.remove("completed");
    }

    updateMessage();
}

function deleteTask(button) {
    button.parentElement.remove();
    updateMessage();
}

taskInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        addTask();
    }
});
</script>

</body>
</html>
